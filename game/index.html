<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素游戏厅 - ACG-Home</title>
    <link rel="icon" href="../favicon.ico" />
    <link rel="stylesheet" href="https://cdn.staticfile.net/font-awesome/6.0.0/css/all.min.css" />
    
    <!-- 引入谷歌像素字体 & Outfit 字体 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap');

        /* - 字体定义 */
        @font-face {
            font-family: "Linotte";
            src: url("../assets/fonts/Linotte\ Regular.otf") format("opentype");
            font-weight: normal;
        }
        @font-face {
            font-family: "Linotte";
            src: url("../assets/fonts/Linotte\ Bold.otf") format("opentype");
            font-weight: bold;
        }
        @font-face {
            font-family: "HYZhengYuan";
            src: url("../assets/fonts/HYZhengYuan-55W.ttf") format("opentype");
            font-weight: normal;
        }

        /* - CSS 变量 & 主题系统 */
        :root {
            --bg-overlay: rgba(15, 16, 21, 0.2);
            --text-color: #ffffff;
            --text-muted: #e2e8f0;
            --primary-neon: #ff007f; /* 霓虹粉 */
            --secondary-neon: #00f0ff; /* 霓虹青 */
            --accent-neon: #ffea00; /* 电玩金 */
            
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.15);
            --card-shadow-hover: 0 0 25px rgba(255, 0, 127, 0.6);
            --toast-bg: rgba(255, 0, 127, 0.95);
            --toast-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-overlay: rgba(10, 10, 12, 0.5);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-neon: #d90429; /* 赛博深红 */
            --secondary-neon: #3a86c8; /* 科技深蓝 */
            --accent-neon: #ffcd3c;
            
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            --card-shadow-hover: 0 0 25px rgba(217, 4, 41, 0.6);
            --toast-bg: rgba(217, 4, 41, 0.95);
        }

        /* - 全局重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Linotte, HYZhengYuan, Outfit, sans-serif;
            transition: background-color 0.35s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-color 0.35s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            background-image: linear-gradient(to bottom, var(--bg-overlay) 0%, var(--bg-overlay) 100%), 
                              url(../assets/images/backgrounds/game_bg.jpg);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: url(https://cdn.jsdelivr.net/gh/honjun/cdn@1.6/img/cursor/normal.cur), auto;
        }

        p, span, h1, h2, h3, h4, input {
            cursor: url(https://cdn.jsdelivr.net/gh/honjun/cdn@1.6/img/cursor/texto.cur), auto;
        }

        a, button, .game-card {
            cursor: url(https://cdn.jsdelivr.net/gh/honjun/cdn@1.6/img/cursor/ayuda.cur), auto;
            text-decoration: none;
        }

        /* 顶部悬浮控制栏 */
        .control-bar {
            position: fixed;
            top: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 100;
            pointer-events: none;
        }

        .control-bar * {
            pointer-events: auto;
        }

        /* 精美返回按钮 */
        .btn-back-home {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .btn-back-home:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-4px);
            border-color: var(--secondary-neon);
            box-shadow: 0 0 15px var(--secondary-neon);
        }

        /* 精美快切主题按钮 */
        .btn-toggle-theme {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            font-size: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-toggle-theme:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(30deg) scale(1.08);
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px var(--primary-neon);
        }

        /* - 主体容器 */
        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 100px auto 60px auto;
            gap: 40px;
            flex: 1;
            position: relative;
            z-index: 5;
        }

        /* 顶部大标题与介绍 */
        .arcade-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .arcade-title {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 
                0 0 5px #fff, 
                0 0 10px var(--secondary-neon), 
                0 0 20px var(--secondary-neon), 
                0 0 40px var(--primary-neon);
            animation: textNeonGlow 3s infinite ease-in-out alternate;
            margin-bottom: 15px;
        }

        .arcade-desc {
            font-size: 15px;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 20px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes textNeonGlow {
            0% {
                text-shadow: 0 0 4px #fff, 0 0 8px var(--secondary-neon), 0 0 15px var(--secondary-neon), 0 0 30px var(--primary-neon);
            }
            100% {
                text-shadow: 0 0 6px #fff, 0 0 12px var(--secondary-neon), 0 0 25px var(--secondary-neon), 0 0 50px var(--primary-neon);
            }
        }

        /* 复古街机模拟框 (CRT Screen Look) */
        .crt-cabinet {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid var(--secondary-neon);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 30px rgba(0, 240, 255, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }

        /* 赛博朋克扫描线与斑驳特效 */
        .crt-cabinet::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .crt-cabinet::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .crt-content {
            z-index: 3;
            text-align: center;
            color: var(--secondary-neon);
            font-family: 'Press Start 2P', monospace;
            line-height: 1.8;
            font-size: 12px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }

        .crt-icon {
            font-size: 48px;
            color: var(--accent-neon);
            margin-bottom: 20px;
            animation: pulseArcadeIcon 1.5s infinite ease-in-out;
            text-shadow: 0 0 15px var(--accent-neon);
        }

        @keyframes pulseArcadeIcon {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
            50% { transform: scale(1.1) rotate(5deg); opacity: 1; }
        }

        .crt-cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: var(--secondary-neon);
            animation: crtBlink 0.8s infinite steps(2);
            vertical-align: middle;
            margin-left: 4px;
            box-shadow: 0 0 8px var(--secondary-neon);
        }

        @keyframes crtBlink {
            from, to { opacity: 0; }
            50% { opacity: 1; }
        }

        .crt-btn-suggest {
            margin-top: 25px;
            padding: 10px 24px;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 10px;
            color: #000000;
            background: var(--accent-neon);
            border: 2px solid var(--accent-neon);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-neon);
            transition: all 0.2s ease;
        }

        .crt-btn-suggest:hover {
            background: transparent;
            color: var(--accent-neon);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-neon);
        }

        /* 游戏列表容器 - 完全透明，不遮挡背景 */
        .games-section {
            width: 100%;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-header {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            position: relative;
            padding-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .section-header::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--secondary-neon) 0%, transparent 100%);
            opacity: 0.6;
        }

        .section-header i {
            color: var(--secondary-neon);
            font-size: 20px;
            text-shadow: 0 0 8px var(--secondary-neon);
        }

        /* 游戏卡片网格 - 极佳透明质感 */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.45); /* 半透明暗幕以提升可读性，保留完全背景视觉 */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--primary-neon);
            box-shadow: var(--card-shadow-hover);
        }

        .game-card-icon {
            font-size: 40px;
            color: var(--text-muted);
            margin-bottom: 16px;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .game-card:hover .game-card-icon {
            color: var(--primary-neon);
            opacity: 1;
            transform: rotate(10deg) scale(1.1);
        }

        .game-card-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .game-card-status {
            font-size: 11px;
            color: var(--primary-neon);
            font-family: 'Press Start 2P', sans-serif;
            background: rgba(255, 0, 127, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 127, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 动漫水印贴纸 */
        .anime-sticker {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 180px;
            height: 220px;
            background: url(../assets/images/content_page_sticker.png) no-repeat center;
            background-size: contain;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        body:hover .anime-sticker {
            opacity: 0.25;
            transform: translateY(-3px);
        }

        /* 自定义 Toast 提示 */
        .custom-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translate(-50%, 30px);
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .custom-toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .arcade-title {
                font-size: 22px;
            }
            .arcade-desc {
                font-size: 13px;
            }
            .crt-cabinet {
                padding: 20px;
                min-height: 220px;
            }
            .crt-content {
                font-size: 9px;
                line-height: 2.0;
            }
            .crt-icon {
                font-size: 36px;
            }
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 16px;
            }
            .game-card {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部控制栏 -->
    <div class="control-bar">
        <!-- 返回主页 -->
        <a href="../index.html" class="btn-back-home" id="btn-back-home">
            <i class="fa-solid fa-arrow-left-long"></i>返回主页
        </a>
        
        <!-- 主题快速切换 -->
        <button class="btn-toggle-theme" id="btn-toggle-theme" title="切换深浅主题">
            <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
    </div>

    <!-- 主体容器 -->
    <main class="main-layout">
        
        <!-- 大标题 -->
        <div class="arcade-header">
            <h1 class="arcade-title" id="main-title">PIXEL ARCADE</h1>
            <span class="arcade-desc"><i class="fa-solid fa-hat-wizard"></i> 消逝的King 的专属游戏空间</span>
        </div>

        <!-- 像素机柜 -->
        <div class="crt-cabinet" id="crt-screen">
            <div class="crt-content">
                <div class="crt-icon"><i class="fa-solid fa-ghost"></i></div>
                <p>> SYSTEM STATUS: READY</p>
                <p>> GAME SELECT: NONE DETECTED</p>
                <p>> MESSAGE: 像素游戏机处于真空期...</p>
                <p>> CHOOSE A GAME BELOW OR INSERT COIN<span class="crt-cursor"></span></p>
                <button class="crt-btn-suggest" id="btn-suggest"><i class="fa-solid fa-coins"></i> 投入游戏币提想法</button>
            </div>
        </div>

        <!-- 小游戏列表区 -->
        <div class="games-section">
            <h2 class="section-header">
                <i class="fa-solid fa-gamepad"></i>像素游艺设备库
            </h2>
            
            <div class="games-grid">
                <!-- 俄罗斯方块 -->
                <div class="game-card">
                    <div class="game-card-icon"><i class="fa-solid fa-cubes"></i></div>
                    <div class="game-card-title">经典俄罗斯方块</div>
                    <div class="game-card-status">Coming Soon</div>
                </div>

                <!-- 经典扫雷 -->
                <div class="game-card">
                    <div class="game-card-icon"><i class="fa-solid fa-bomb"></i></div>
                    <div class="game-card-title">复古扫雷</div>
                    <div class="game-card-status">Coming Soon</div>
                </div>

                <!-- 贪吃蛇 -->
                <div class="game-card">
                    <div class="game-card-icon"><i class="fa-solid fa-worm"></i></div>
                    <div class="game-card-title">贪吃蛇大作战</div>
                    <div class="game-card-status">Coming Soon</div>
                </div>

                <!-- 五子棋 -->
                <div class="game-card">
                    <div class="game-card-icon"><i class="fa-solid fa-chess-board"></i></div>
                    <div class="game-card-title">联机五子棋</div>
                    <div class="game-card-status">Coming Soon</div>
                </div>
            </div>
        </div>
        
    </main>

    <!-- 动漫贴纸 -->
    <div class="anime-sticker"></div>

    <!-- Toast 提示框 -->
    <div class="custom-toast" id="custom-toast">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span id="toast-text-content">提示信息</span>
    </div>

    <!-- JS 控制脚本 -->
    <script>
        // - 主题同步与切换机制
        function updateTheme() {
            let targetColor = localStorage.getItem("theme.color") || "light";
            if (targetColor === "!autoSwitch") {
                if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    targetColor = "dark";
                } else {
                    targetColor = "light";
                }
            }
            document.body.setAttribute("data-theme", targetColor);
        }

        // 按钮快捷切换主题
        document.getElementById("btn-toggle-theme").addEventListener("click", () => {
            let current = localStorage.getItem("theme.color") || "light";
            if (current === "!autoSwitch") {
                current = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            const next = current === "light" ? "dark" : "light";
            localStorage.setItem("theme.color", next);
            updateTheme();
            showToast(`已切换至 ${next === 'dark' ? '赛博深红' : '炫彩霓虹'} 空间 (∠・ω< )★`);
        });

        // 监听本地存储变更与系统主题变更
        window.addEventListener("storage", updateTheme);
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateTheme);
        updateTheme(); // 初始化执行

        // - Toast 提示方法
        let toastTimer = null;
        function showToast(text) {
            const toast = document.getElementById("custom-toast");
            const content = document.getElementById("toast-text-content");
            content.innerText = text;
            
            toast.classList.add("show");
            
            if (toastTimer) {
                clearTimeout(toastTimer);
            }
            
            toastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // - 投币互动逻辑
        document.getElementById("btn-suggest").addEventListener("click", () => {
            const suggestions = [
                "听到了游戏币落下的清脆声音！(๑•̀ㅂ•́)و✧",
                "硬币 +1！也许下个上线的就是俄罗斯方块？",
                "投币成功！站长已经感受到了你的强烈呼声！",
                "叮咚！叮咚！街机开始重启，小游戏企划加载中...",
                "投币成功！想玩扫雷还是贪吃蛇？可以发邮件反馈给站长哦！"
            ];
            const randomMsg = suggestions[Math.floor(Math.random() * suggestions.length)];
            
            // 播放一个清脆的投币声效（如果想扩展）并展示 Toast 提示
            showToast(randomMsg);
            
            // CRT 屏幕微特效：临时更改消息
            const crtScreen = document.getElementById("crt-screen");
            crtScreen.style.boxShadow = "0 0 45px rgba(255, 0, 127, 0.8), inset 0 0 30px rgba(255, 0, 127, 0.4)";
            crtScreen.style.borderColor = "var(--primary-neon)";
            
            setTimeout(() => {
                crtScreen.style.boxShadow = "0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 30px rgba(0, 240, 255, 0.2)";
                crtScreen.style.borderColor = "var(--secondary-neon)";
            }, 1000);
        });

        // 鼠标悬停卡片微动效声效或者彩蛋提示
        const cards = document.querySelectorAll(".game-card");
        cards.forEach(card => {
            card.addEventListener("click", () => {
                const title = card.querySelector(".game-card-title").innerText;
                showToast(`【${title}】设备通电中... 敬请期待！🎮`);
            });
        });
    </script>
</body>
</html>
